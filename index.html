<title>宗龍的台語課・網站心智圖</title>
<style>
  :root{
    --black:#111111; --yellow:#FFD400; --white:#FFFFFF;
    --gray:#2A2A2A; --light:#F5F5F5; --line:#555555; --muted:#A8A8A8;
    --gap:26px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--black); color:var(--white);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    line-height:1.4;
  }
  header{padding:16px 24px 12px;border-bottom:4px solid var(--yellow)}
  header h1{margin:0;font-size:clamp(1.25rem,3vw,1.8rem);letter-spacing:.04em}
  header h1 span{color:var(--yellow)}
  header p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
  .toolbar{
    position:sticky;top:0;z-index:5;background:var(--black);
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:2px 24px;border-bottom:1px solid var(--gray);
  }
  .toolbar input{
    flex:1 1 220px;min-width:0;padding:1px 10px;border-radius:6px;
    border:2px solid var(--gray);background:var(--gray);color:var(--white);font-size:.9rem;
  }
  .toolbar input:focus{outline:none;border-color:var(--yellow)}
  .toolbar button{
    padding:3px 12px;border:0;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:700;
    background:var(--yellow);color:var(--black);
  }
  .toolbar button.ghost{background:transparent;color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
  .toolbar .stat{color:var(--muted);font-size:.85rem;white-space:nowrap}
  /* 訪客計數器：原圖是固定配色的 SVG，用濾鏡轉成黑底白字，再以 multiply 疊黃色 → 黑底黃字 */
  .visits{
    display:inline-flex;flex:0 0 auto;isolation:isolate;overflow:hidden;
    background:var(--yellow);border:2px solid var(--yellow);border-radius:6px;
  }
  /* 禁止選取（手機長按也一樣），搜尋框除外 */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .toolbar input{-webkit-user-select:text;user-select:text}
  .visits img{display:block;height:20px;width:auto;filter:grayscale(1) brightness(.9) contrast(6);mix-blend-mode:multiply}

  /* ===== 節點 ===== */
  .node{
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
    border-radius:10px;padding:6px 6px 6px 12px;max-width:300px;
  }
  .node a{color:inherit;text-decoration:none;font-weight:600}
  .node a:hover,.node a:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
  .node .ext{font-size:.75em;opacity:.7;margin-left:2px}
  .node a.quiz{
    flex:0 0 auto;font-size:.75rem;font-weight:700;white-space:nowrap;
    padding:2px 8px;border-radius:999px;background:var(--yellow);color:var(--black);
  }
  .tog{
    flex:0 0 auto;min-width:30px;height:26px;padding:0 6px;border-radius:13px;cursor:pointer;
    border:2px solid currentColor;background:transparent;color:inherit;font-size:.78rem;font-weight:700;
  }
  .node.leaf{padding-right:12px}
  .lv0>.node,.hub>.node{
    background:var(--yellow);color:var(--black);font-size:1.3rem;
    padding:14px 20px;border-radius:16px;box-shadow:0 0 0 6px rgba(255,212,0,.18);
  }
  .lv1>.node{background:var(--white);color:var(--black);border-left:6px solid var(--yellow)}
  .lv2>.node{background:var(--gray);color:var(--yellow);border:1px solid var(--yellow)}
  .lv3>.node{background:var(--gray);color:var(--white);font-size:.92rem}
  .lv3>.node a:not(.quiz){font-weight:500}
  .lv1>.node .tog{background:var(--black);color:var(--yellow);border-color:var(--black)}
  .node.hit{box-shadow:0 0 0 3px var(--yellow)}
  li.collapsed>ul{display:none}
  #map li.hide{display:none}  /* 須高於 .radial li{display:flex}，搜尋時才隱藏得掉 */
  ul{list-style:none;margin:0;padding:0}

  /* ===== 橫式螢幕：由中心向外擴散（右側往右長、左側往左長） ===== */
  .map{
    display:flex;overflow:auto;cursor:grab;
    height:calc(100vh - var(--chrome, 150px));min-height:320px;
  }
  .map.dragging{cursor:grabbing;user-select:none}
  /* 四周留半個畫面的空白，讓任何項目都能被捲到正中央 */
  .radial{margin:auto;padding:45vh 45vw;display:flex;align-items:center;width:max-content}
  .hub{flex:0 0 auto;position:relative;z-index:1}
  /* 分支不可被壓縮，否則超出容器的部分捲動不到 */
  .radial>*,.radial li>.node,.radial li>ul{flex-shrink:0}
  /* 兩側外緣留白放在分支本身，捲到最邊時末端項目外仍有空間 */
  .radial .side.R{padding-right:40px}
  .radial .side.L{padding-left:40px}
  .radial ul{position:relative;display:flex;flex-direction:column;padding-left:var(--gap)}
  .radial li{position:relative;display:flex;align-items:center;padding:4px 0 4px var(--gap)}
  .radial li::before{content:"";position:absolute;left:0;top:50%;width:var(--gap);border-top:2px solid var(--line)}
  .radial li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
  .radial li:first-child::after{top:50%}
  .radial li:last-child::after{bottom:50%}
  .radial li:only-child::after{display:none}
  .radial ul::before{content:"";position:absolute;left:0;top:50%;width:var(--gap);border-top:2px solid var(--line)}
  /* 左半邊鏡像 */
  .radial .L{padding-left:0;padding-right:var(--gap)}
  .radial .L ul{padding-left:0;padding-right:var(--gap)}
  .radial .L li{flex-direction:row-reverse;padding:4px var(--gap) 4px 0}
  .radial .L li::before,.radial .L ul::before,.radial .L::before{left:auto;right:0}
  .radial .L li::after{left:auto;right:0;border-left:0;border-right:2px solid var(--line)}
  /* 每一組兄弟項目等寬（寬度由 JS 依最寬者設定），標題起點對齊同一條線 */
  .radial .side .node{display:grid;align-items:center;column-gap:6px}
  /* 右側：標題靠左，測驗鈕、數字鈕在右端 */
  .radial .R .node{grid-template-columns:1fr auto auto;padding:6px 6px 6px 12px}
  .radial .R .node.leaf{padding-right:12px}
  .radial .R .node>.tog{justify-self:end}
  /* 左側：數字鈕固定在最左欄（44px），標題接在後面 */
  .radial .L .node{grid-template-columns:auto 1fr auto;padding:6px 12px 6px 6px}
  .radial .L .node>.tog{grid-column:1;grid-row:1;width:44px}
  .radial .L .node>a:not(.quiz){grid-column:2;grid-row:1}
  .radial .L .node>a.quiz{grid-column:3;grid-row:1}
  .radial .L .node.leaf{padding-left:12px}
  .radial .L.tog-group>li>.node.leaf,.radial .L .tog-group>li>.node.leaf{padding-left:56px}
  /* 第一層主幹用黃線 */
  .radial .side::before,.radial .side>li::before,.radial .side>li::after{border-color:var(--yellow)!important;border-width:3px}

  .vtree{display:none}

  /* ===== 直式螢幕：由上而下的樹狀清單 ===== */
  @media (orientation:portrait){
    header,.toolbar{padding-left:16px;padding-right:16px}
    .map{display:block;height:auto;overflow:visible;cursor:auto;padding:12px 16px 30px}
    .radial{display:none}
    .vtree{display:block}
    .vtree ul{margin-left:14px}
    .vtree li{position:relative;padding:4px 0 4px 20px}
    .vtree li::before{content:"";position:absolute;left:0;top:21px;width:18px;border-top:2px solid var(--line)}
    .vtree li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
    .vtree li:last-child::after{bottom:auto;height:22px}
    .vtree>li{padding-left:0}
    .vtree>li::before,.vtree>li::after{display:none}
    .vtree>li>ul{margin-left:10px;margin-top:8px}
    .vtree>li>ul>li::before,.vtree>li>ul>li::after{border-color:var(--yellow)}
    .node{display:flex;width:fit-content;max-width:100%}
    .node a:not(.quiz){flex:1 1 auto}
    .lv0>.node{font-size:1.1rem;padding:10px 16px}
  }

  footer{padding:14px 24px 24px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--gray)}
  footer a{color:var(--yellow)}
</style>
</head>

const SITE = 'https://sites.google.com/ms.mingdao.edu.tw/tsiam/';
const S = p => /^https?:/.test(p) ? p : SITE + encodeURI(p);
const PEN = 'https://cyril-mingdao.github.io/pen/';
const QUIZ = 'https://cyril-mingdao.github.io/taigi-quiz/';

// 各課次頁內「📝 線頂測驗」的檔名規則：工具代碼-版本代碼L課次（育達第5課分 5-1／5-2 時加後綴）
const QUIZ_TOOL = {形音義: 'HINGIM', 生份字: 'SIANN', 選詞塌空: 'SUANSU', 咱來鬥句: 'TAUKU'};
const QUIZ_VER = {真平版國中第1冊: 'CHINPING-B1', 全華版國中第3冊: 'CHUANHWA-B3', 育達版高中全1冊: 'YUDA-B1', 康軒版國中第2冊: 'KANGHSUAN-B2'};
const CN = {一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8};
function quizOf(path){
  const [tool, ver, page] = path.split('/');
  const m = page && page.match(/^第([一二三四五六七八\d])課-(\d(?=\D))?/);
  if (!QUIZ_TOOL[tool] || !QUIZ_VER[ver] || !m) return null;
  const n = CN[m[1]] || m[1];
  return `${QUIZ}${QUIZ_TOOL[tool]}-${QUIZ_VER[ver]}L${n}${m[2] ? '-' + m[2] : ''}.html`;
}

// 將「工具/版本/課次」路徑清單依版本分組
function byVersion(list){
  const groups = new Map();
  list.forEach(([path, label]) => {
    const parts = path.split('/');
    const node = {t: label, u: path, q: quizOf(path)};
    if (parts.length < 3) { groups.set('_' + path, node); return; }
    if (!groups.has(parts[1])) groups.set(parts[1], {t: parts[1], u: parts[0], c: []});
    groups.get(parts[1]).c.push(node);
  });
  return [...groups.values()];
}

    const ul = document.createElement('ul');
    n.c.forEach(ch => ul.append(build(ch, lv + 1, count)));
    if (n.c.some(ch => ch.c && ch.c.length)) ul.classList.add('tog-group');
    li.append(box, ul);
    li._count = n.c.length;
    b.addEventListener('click', () => {
      const opening = li.classList.contains('collapsed');
      keepInPlace(box, () => { setOpen(li, opening); equalize(); });
      if (opening) { revealBranch(li); return; }
      // 收合：畫面回到「上一層剛展開時」的位置；收合第一層則回到中心
      const parent = li.parentElement.closest('li');
      if (isRadial()) {
        if (parent) revealBranch(parent, parent._view); else centerHub(true);
      } else {
        box.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      }
    });
  } else {
    box.classList.add('leaf');
    li.append(box);
  }
  return li;
}

// 直式：單一樹
const vtree = document.getElementById('vtree');
const vroot = build({...DATA, c: []}, 0, false);
const vul = document.createElement('ul');
DATA.c.forEach(ch => vul.append(build(ch, 1, true)));
vroot.append(vul);
vtree.append(vroot);

// 橫式：中心向外；左側由上往下為「網站紹介～8」，右側由上往下為「9～常用參考資源」
const radial = document.getElementById('radial');
const half = Math.ceil(DATA.c.length / 2);
const R = document.createElement('ul'); R.className = 'side R';
const L = document.createElement('ul'); L.className = 'side L tog-group';
DATA.c.slice(0, half).forEach(ch => L.append(build(ch, 1, false)));
DATA.c.slice(half).forEach(ch => R.append(build(ch, 1, false)));
const hub = document.createElement('div'); hub.className = 'hub';
hub.append(build({...DATA, c: []}, 0, false).firstChild);
radial.append(L, hub, R);

function setOpen(li, open){
  li.classList.toggle('collapsed', !open);
  const b = li.querySelector(':scope>.node>.tog');
  if (b){ b.textContent = open ? '－' : '＋' + li._count; b.setAttribute('aria-expanded', open); }
}
const branches = () => document.querySelectorAll('#map li:has(>ul)');
function defaultState(){ branches().forEach(li => setOpen(li, li.classList.contains('lv0'))); }
defaultState();

// 展開／收合後，讓被點的節點留在原本的螢幕位置（避免中心擴散時畫面跳動）
const map = document.getElementById('map');
const isRadial = () => getComputedStyle(radial).display !== 'none';
function keepInPlace(el, fn){
  if (!isRadial()) { fn(); return; }
  const before = el.getBoundingClientRect();
  fn();
  const after = el.getBoundingClientRect();
  map.scrollLeft += after.left - before.left;
  map.scrollTop += after.top - before.top;
}
// 展開後把「被點的項目＋新長出的子項目」整塊捲進可視範圍；
// 放不下時以最外側（末端項目）那一邊為準，確保最後觸發的項目文字完整顯示
// base：以哪個捲動位置為起點計算（收合時傳入上一層展開當時記下的位置）；算出的位置記在 li._view
function revealBranch(li, base){
  if (!isRadial()) return;
  const PAD = 24;
  const cur = {left: map.scrollLeft, top: map.scrollTop};
  base = base || cur;
  const sx = cur.left - base.left, sy = cur.top - base.top;   // 換算成「捲到 base 時」的螢幕座標
  const at = el => { const x = el.getBoundingClientRect(); return {left: x.left + sx, right: x.right + sx, top: x.top + sy, bottom: x.bottom + sy, height: x.height}; };
  const box = li.querySelector(':scope>.node');
  const ul = li.querySelector(':scope>ul');
  const rects = [at(box)];
  if (ul && !li.classList.contains('collapsed')) rects.push(at(ul));
  const r = {
    left: Math.min(...rects.map(x => x.left)), right: Math.max(...rects.map(x => x.right)),
    top: Math.min(...rects.map(x => x.top)), bottom: Math.max(...rects.map(x => x.bottom))
  };
  const m = map.getBoundingClientRect();
  const view = {left: m.left + PAD, right: m.left + map.clientWidth - PAD, top: m.top + PAD, bottom: m.top + map.clientHeight - PAD};
  const onLeft = !!li.closest('.L');
  let dx = 0, dy = 0;
  if (r.right - r.left > view.right - view.left) {
    dx = onLeft ? r.left - view.left : r.right - view.right;           // 太寬：對齊外側邊緣
  } else if (r.left < view.left) dx = r.left - view.left;
  else if (r.right > view.right) dx = r.right - view.right;
  if (r.bottom - r.top > view.bottom - view.top) {
    const b = at(box);                                                  // 太高：讓被點的項目置中
    dy = (b.top + b.height / 2) - (view.top + view.bottom) / 2;
  } else if (r.top < view.top) dy = r.top - view.top;
  else if (r.bottom > view.bottom) dy = r.bottom - view.bottom;
  const target = {
    left: Math.max(0, Math.min(base.left + dx, map.scrollWidth - map.clientWidth)),
    top: Math.max(0, Math.min(base.top + dy, map.scrollHeight - map.clientHeight))
  };
  li._view = target;
  map.scrollTo({...target, behavior: 'smooth'});
}
function centerHub(smooth){
  if (!isRadial()) return;
  const m = map.getBoundingClientRect(), h = hub.getBoundingClientRect();
  map.scrollTo({
    left: map.scrollLeft + (h.left + h.width / 2) - (m.left + m.width / 2),
    top: map.scrollTop + (h.top + h.height / 2) - (m.top + m.height / 2),
    behavior: smooth ? 'smooth' : 'auto'
  });
}
function fitHeight(){
  const top = map.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--chrome', top + 'px');
}
// 每一組兄弟項目統一寬度（取該組最寬者），讓標題起點對齊同一條線；橫式、直式都適用
function equalize(){
  (isRadial() ? radial : vtree).querySelectorAll('ul').forEach(ul => {
    const nodes = [...ul.querySelectorAll(':scope>li>.node')];
    nodes.forEach(n => n.style.width = '');
    const w = Math.max(0, ...nodes.map(n => n.getBoundingClientRect().width));
    if (w > 0) nodes.forEach(n => n.style.width = Math.ceil(w) + 'px');
  });
}
equalize(); fitHeight(); centerHub();
document.fonts && document.fonts.ready.then(() => { equalize(); centerHub(); });
addEventListener('resize', () => { equalize(); fitHeight(); centerHub(); });

// 橫式：拖曳平移
let drag = null;
map.addEventListener('pointerdown', e => {
  if (!isRadial() || e.target.closest('a,button') || e.pointerType === 'touch') return;
  drag = {x: e.clientX, y: e.clientY, l: map.scrollLeft, t: map.scrollTop};
  map.classList.add('dragging'); map.setPointerCapture(e.pointerId);
});
map.addEventListener('pointermove', e => {
  if (!drag) return;
  map.scrollLeft = drag.l - (e.clientX - drag.x);
  map.scrollTop = drag.t - (e.clientY - drag.y);
});
['pointerup', 'pointercancel'].forEach(t => map.addEventListener(t, () => { drag = null; map.classList.remove('dragging'); }));

document.getElementById('stat').textContent = `共 ${total} 個連結`;
document.getElementById('expand').onclick = () => { branches().forEach(li => setOpen(li, true)); equalize(); centerHub(); };
document.getElementById('collapse').onclick = () => { document.getElementById('q').value = ''; filter(''); equalize(); centerHub(); };

// ===== 搜尋（兩種版面同步） =====
function walk(li, q){
  const self = li._label.toLowerCase().includes(q);
  const kids = [...li.querySelectorAll(':scope>ul>li')];
  let any = false;
  kids.forEach(k => { if (walk(k, q)) any = true; });
  li.querySelector(':scope>.node').classList.toggle('hit', self);
  // 符合的項目底下整枝保留，方便直接點課次
  if (self) kids.forEach(k => { k.classList.remove('hide'); k.querySelectorAll('li.hide').forEach(x => x.classList.remove('hide')); });
  if (kids.length) setOpen(li, any || self);
  li.classList.toggle('hide', !(self || any));
  return self || any;
}
function filter(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#map li').forEach(li => { li.classList.remove('hide'); li.querySelector(':scope>.node').classList.remove('hit'); });
  if (!q){ defaultState(); return 0; }
  [...vul.children].forEach(li => walk(li, q));
  [...R.children, ...L.children].forEach(li => walk(li, q));
  return vtree.querySelectorAll('.node.hit').length;
}
document.getElementById('q').addEventListener('input', e => {
  const h = filter(e.target.value);
  equalize();
  document.getElementById('stat').textContent = e.target.value.trim() ? `找到 ${h} 個項目` : `共 ${total} 個連結`;
  if (h) centerHit(); else centerHub();
});

// 搜尋結果：把最上層的符合項目盡量移到畫面中央（捲到底時就停在邊界，不強制）
function centerHit(){
  const tree = isRadial() ? radial : vtree;
  const depth = n => { let d = 0; for (let p = n.parentElement; p && p !== tree; p = p.parentElement) if (p.tagName === 'LI') d++; return d; };
  const hits = [...tree.querySelectorAll('.node.hit')];
  if (!hits.length) return;
  const target = hits.reduce((a, b) => depth(b) < depth(a) ? b : a);
  const t = target.getBoundingClientRect();
  if (isRadial()) {
    const m = map.getBoundingClientRect();
    map.scrollTo({
      left: map.scrollLeft + (t.left + t.width / 2) - (m.left + map.clientWidth / 2),
      top: map.scrollTop + (t.top + t.height / 2) - (m.top + map.clientHeight / 2),
      behavior: 'smooth'
    });
  } else {
    const bar = document.querySelector('.toolbar').getBoundingClientRect().bottom;
    window.scrollTo({top: window.scrollY + (t.top + t.height / 2) - (bar + (innerHeight - bar) / 2), behavior: 'smooth'});
  }
}
</script>
</body>
